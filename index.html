<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <title>40th Birthday Countdown</title>

  <style>

    body {

      font-family: Arial, sans-serif;

      text-align: center;

      background: #f0f8ff;

      color: #333;

      padding-top: 50px;

    }

    #countdown {

      font-size: 2.5rem;

      margin-top: 20px;

    }

    .time-box {

      display: inline-block;

      margin: 0 10px;

    }

    .label {

      font-size: 0.8rem;

      color: #666;

    }

  </style>

</head>

<body>


<h1>Its a surprise BWB is not already 40 but <p> she is still 39 ( just ) <p> so now is the time to tart the countdown</h1>

<div id="countdown">

  <span class="time-box"><span id="days">–</span> <span class="label">Days</span></span>

  <span class="time-box"><span id="hours">–</span> <span class="label">Hours</span></span>

  <span class="time-box"><span id="minutes">–</span> <span class="label">Minutes</span></span>

  <span class="time-box"><span id="seconds">–</span> <span class="label">Seconds</span></span>

</div>


<script>

  // ---------- CONFIGURATION ----------

  // Set the target date/time here.

  // Example: next Sunday at 6 PM local time.

  const targetDayOfWeek = 0; // 0 = Sunday, 1 = Monday, … 6 = Saturday

  const targetHour = 18;     // 24‑hour clock (18 = 6 PM)

  const targetMinute = 0;

  const targetSecond = 0;

  // ------------------------------------


  function getNextTargetDate() {

    const now = new Date();

    const result = new Date(now);


    // Move to the desired hour/minute/second today first

    result.setHours(targetHour, targetMinute, targetSecond, 0);


    // If today is already past the target time, move forward one week

    if (result <= now) {

      result.setDate(result.getDate() + 7);

    }


    // Adjust to the correct weekday (Sunday = 0)

    const dayDiff = (targetDayOfWeek - result.getDay() + 7) % 7;

    result.setDate(result.getDate() + dayDiff);


    return result;

  }


  const deadline = getNextTargetDate();


  function updateCountdown() {

    const now = new Date();

    const diff = deadline - now;


    if (diff <= 0) {

      document.getElementById('countdown').innerHTML = "<strong>It’s time! 🎉</strong>";

      clearInterval(timer);

      return;

    }


    const seconds = Math.floor((diff / 1000) % 60);

    const minutes = Math.floor((diff / (1000 * 60)) % 60);

    const hours   = Math.floor((diff / (1000 * 60 * 60)) % 24);

    const days    = Math.floor(diff / (1000 * 60 * 60 * 24));


    document.getElementById('days').textContent    = days;

    document.getElementById('hours').textContent   = String(hours).padStart(2, '0');

    document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');

    document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');

  }


  // Update every second

  const timer = setInterval(updateCountdown, 1000);

  updateCountdown(); // initial call

</script>


</body>

</html>
