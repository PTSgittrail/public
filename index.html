<!DOCTYPE html>


<html lang="en">


<head>


<meta charset="UTF-8">


<title>Box Wine Beth – Countdown + Rotating Text</title>


<style>


 
/* -------------------------------------------------

     Layout & basic styling

 ------------------------------------------------- */


 body{


 display:flex;


 flex-direction:column;


 justify-content:center;


 align-items:center;


 height:100vh;


 margin:0;


 background:#f0f8ff; /* light sky‑blue background */


 font-family:Arial, Helvetica, sans-serif;


 overflow:hidden; /* hide any overflow from the spinner */


 position:relative;


 }




 h1{


 margin-bottom:0.5rem;


 font-size:2rem;


 color:#222;


 }




 
/* -------------------------------------------------

     Countdown display

 ------------------------------------------------- */


 #countdown{


 font-size:2.2rem;


 margin-bottom:2rem;


 color:#333;


 }


 .time-box{


 display:inline-block;


 margin:0 8px;


 text-align:center;


 }


 .label{


 font-size:0.8rem;


 color:#666;


 }




 
/* -------------------------------------------------

     Rotating text (“box wine beth”)

 ------------------------------------------------- */


 .spinner{


 position:absolute;


 font-size:4rem;


 font-weight:bold;


 color:rgba(74,20,140,0.15); /* deep purple, very faint */


 animation: spin 8s linear infinite;


 pointer-events:none; /* lets clicks pass through */


 user-select:none;


 }




 @keyframes spin{


 from{transform:rotate(0deg);}


 to {transform:rotate(360deg);}


 }


</style>


</head>


<body>




<h1>Countdown to the 40th Celebration</h1>


<div id="countdown">


 <span class="time-box"><span id="days">–</span> <span class="label">Days</span></span>


 <span class="time-box"><span id="hours">–</span> <span class="label">Hours</span></span>


 <span class="time-box"><span id="minutes">–</span> <span class="label">Minutes</span></span>


 <span class="time-box"><span id="seconds">–</span> <span class="label">Seconds</span></span>


</div>




<!-- Rotating text -->


<div class="spinner">box wine beth</div>




<script>


/* -------------------------------------------------

   Configuration – set the target day/time here

 ------------------------------------------------- */


// Target: next Sunday at 6 PM (local time)


// Change these values if you need a different day or time.


const TARGET_DAY_OF_WEEK = 0; // 0 = Sunday, 1 = Monday, …


const TARGET_HOUR = 18; // 24‑hour clock (18 = 6 PM)


const TARGET_MINUTE = 0;


const TARGET_SECOND = 0;




/* -------------------------------------------------

   Compute the next occurrence of the target date/time

 ------------------------------------------------- */


function getNextTargetDate(){


 const now = new Date();


 const candidate = new Date(now);




 // Start with today at the desired hour/minute/second


 candidate.setHours(TARGET_HOUR, TARGET_MINUTE, TARGET_SECOND, 0);




 // If that moment already passed, jump a week ahead


 if(candidate <= now){


 candidate.setDate(candidate.getDate() + 7);


 }




 // Align to the correct weekday (Sunday = 0)


 const dayDiff = (TARGET_DAY_OF_WEEK - candidate.getDay() + 7) % 7;


 candidate.setDate(candidate.getDate() + dayDiff);




 return candidate;


}




const deadline = getNextTargetDate();




/* -------------------------------------------------

   Countdown logic – updates every second

 ------------------------------------------------- */


function updateCountdown(){


 const now = new Date();


 const diff = deadline - now;




 if(diff <= 0){


 document.getElementById('countdown').innerHTML =


 '<strong>It’s time! 🎉</strong>';


 clearInterval(timer);


 return;


 }




 const seconds = Math.floor((diff/1000) % 60);


 const minutes = Math.floor((diff/(1000*60)) % 60);


 const hours = Math.floor((diff/(1000*60*60)) % 24);


 const days = Math.floor(diff/(1000*60*60*24));




 document.getElementById('days').textContent = days;


 document.getElementById('hours').textContent = String(hours).padStart(2,'0');


 document.getElementById('minutes').textContent = String(minutes).padStart(2,'0');


 document.getElementById('seconds').textContent = String(seconds).padStart(2,'0');


}




// Kick off the timer


const timer = setInterval(updateCountdown, 1000);


updateCountdown(); // immediate first run


</script>




</body>


</html>
